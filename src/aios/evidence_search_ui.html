<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIOS Evidence Search</title>
<style>
:root{color-scheme:light;--ink:#19272b;--muted:#536367;--line:#d6dfdc;--paper:#f6f8f6;--accent:#1d6558;--warn:#815420}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:1280px;margin:auto;padding:28px 32px}h1{font-size:25px;letter-spacing:-.025em;margin:0 0 4px}p{margin:0;color:var(--muted)}.search{display:flex;gap:10px;margin-top:22px;max-width:720px}input{flex:1;min-width:0;border:1px solid #a9bcb5;border-radius:7px;background:#fff;padding:11px 13px;font:inherit;color:var(--ink)}button{font:inherit;cursor:pointer}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}button:focus-visible,input:focus-visible{outline:3px solid #e2a04a;outline-offset:2px}.submit{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:7px;padding:10px 22px;font-weight:650}.layout{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:24px;min-height:480px}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;min-width:0}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);font-weight:650}.status{padding:14px 20px;color:var(--muted);font-size:13px}.warning{color:var(--warn);white-space:pre-wrap}.item{display:block;width:100%;text-align:left;padding:16px 20px;border:0;border-top:1px solid #edf1ef;background:#fff;color:var(--ink)}.item:hover,.item[aria-current=true]{background:#edf5f1}.tag{color:var(--accent);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.path{display:block;font-weight:600;overflow-wrap:anywhere;margin:4px 0}.meta{display:block;color:var(--muted);font-size:12px}.reader{padding:22px 24px}.reader h2{font-size:18px;margin:0 0 8px;overflow-wrap:anywhere}.reader p{font-size:13px;overflow-wrap:anywhere}.source-links{margin-top:14px;font-size:13px}.source-links a{display:block;overflow-wrap:anywhere;color:var(--accent);margin-top:5px}.reader pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;margin:24px 0 0;color:#203237}.empty{padding:28px 24px;color:var(--muted)}@media(max-width:720px){.wrap{padding:20px 16px}.layout{grid-template-columns:1fr}.reader{padding:20px}.search{flex-direction:column}.submit{align-self:flex-start}}
.source-pagination{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.source-pagination button{padding:6px 12px}.source-pagination + pre{max-height:60vh;overflow:auto;margin-top:12px}
</style>
</head>
<body>
<header><div class="wrap"><h1>Evidence Search</h1><p>Search SIOS records and read the original source. Use specific keywords. Matching does not answer or interpret your question.</p><form class="search" id="search-form"><label for="query" class="visually-hidden">Search records</label><input id="query" name="query" placeholder="Search Brain, Memory and Missions" required maxlength="1000" autocomplete="off"><button class="submit" type="submit">Search</button></form></div></header>
<main class="wrap"><div class="layout"><section class="panel" aria-labelledby="results-heading"><div class="panel-head" id="results-heading">Results</div><div id="status" class="status" role="status" aria-live="polite">Enter a keyword to search.</div><div id="warnings" class="status warning" role="status"></div><div id="results"></div></section><section class="panel" aria-labelledby="source-heading"><div class="panel-head" id="source-heading">Original source</div><div id="reader" class="empty">Select a result to inspect its full source and revision.</div></section></div></main>
<script nonce="__NONCE__">
'use strict';
let csrf=location.hash.slice(1);if(csrf)sessionStorage.setItem('sios-evidence-session',csrf);else csrf=sessionStorage.getItem('sios-evidence-session')||'';history.replaceState(null,'',location.pathname);let pending=false;
const form=document.getElementById('search-form'),status=document.getElementById('status'),warnings=document.getElementById('warnings'),results=document.getElementById('results'),reader=document.getElementById('reader');
function add(parent,tag,text,className){const el=document.createElement(tag);el.textContent=text;if(className)el.className=className;parent.appendChild(el);return el;}
function renderSourceText(parent,text){
 const max=32000,parts=[];let start=0;
 while(start<text.length){let end=Math.min(start+max,text.length);if(end<text.length&&end>start&&/[\uD800-\uDBFF]/.test(text[end-1])&&/[\uDC00-\uDFFF]/.test(text[end]))end--;parts.push(text.slice(start,end));start=end;}
 if(!parts.length)parts.push('');
 if(parts.length===1){add(parent,'pre',parts[0]);return;}
 const nav=add(parent,'div','','source-pagination'),previous=add(nav,'button','Previous part'),status=add(nav,'span',''),next=add(nav,'button','Next part'),pre=add(parent,'pre','');
 nav.setAttribute('role','group');nav.setAttribute('aria-label','Original source parts');status.setAttribute('aria-live','polite');
 previous.type=next.type='button';let index=0;
 function show(){pre.textContent=parts[index];pre.scrollTop=0;status.textContent=' Part '+(index+1)+' of '+parts.length+' · Full original is available across all parts. ';previous.disabled=index===0;next.disabled=index===parts.length-1;}
 previous.addEventListener('click',()=>{if(index>0){index--;show();}});next.addEventListener('click',()=>{if(index<parts.length-1){index++;show();}});show();
}
function showSource(row,button){for(const el of results.querySelectorAll('button'))el.removeAttribute('aria-current');button.setAttribute('aria-current','true');reader.replaceChildren();reader.className='reader';add(reader,'h2',row.path);add(reader,'p','Source: '+row.store+' · Revision: '+row.revision+(row.read_method==='verified_snapshot'?' · Reconstructed from verified snapshot':''));if(row.snapshot_status)add(reader,'p','Snapshot item compared with current Mission log: '+row.snapshot_status);add(reader,'p','Document status (as recorded): '+(row.declared_status||'unknown')+' · Evidence status (as recorded): '+(row.evidence_status||'unknown'));const dates=[];if(row.recorded_at)dates.push('Recorded: '+row.recorded_at);if(row.last_touched)dates.push('Last touched: '+row.last_touched);if(row.decision_date)dates.push('Decision date: '+row.decision_date);if(row.verified_at)dates.push('Verification recorded: '+row.verified_at);if(row.review_due)dates.push('Review due: '+row.review_due);if(row.review_overdue===true)dates.push('Review overdue');if(row.stale_after)dates.push('Stale after: '+row.stale_after);if(row.stale===true)dates.push('Marked stale');if(row.review_overdue===null)dates.push('Freshness not established');if(row.changed_since_search===true)dates.push('Source changed since search');if(row.changed_since_search===null)dates.push('Search revision unavailable');add(reader,'p',dates.join(' · '));const links=[...new Set(row.text.match(/https:\/\/[^\s<>"']+|codex:\/\/threads\/[0-9a-f-]{36}/gi)||[])].slice(0,10);if(links.length){const block=add(reader,'div','Referenced links','source-links');for(let link of links){link=link.replace(/[.,;:)]+$/,'');try{const u=new URL(link);if(u.protocol==='https:'&&!u.username&&!u.password||u.protocol==='codex:'&&/^codex:\/\/threads\/[0-9a-f-]{36}$/i.test(link)){const a=add(block,'a',link);a.href=link;a.target='_blank';a.rel='noopener noreferrer';}}catch(_){}}}renderSourceText(reader,row.text);}
form.addEventListener('submit',async event=>{event.preventDefault();const q=document.getElementById('query').value.trim();if(!q||pending)return;if(!csrf){status.textContent='Use the private session link printed by the launcher.';return;}pending=true;form.querySelector('button').disabled=true;results.replaceChildren();reader.replaceChildren();reader.className='empty';reader.textContent='Select a result to inspect its full source and revision.';warnings.textContent='';status.textContent='Searching…';try{const response=await fetch('/search',{method:'POST',headers:{'Content-Type':'application/json','X-SIOS-CSRF':csrf},body:JSON.stringify({query:q})});if(!response.ok)throw new Error('search');const data=await response.json();status.textContent=data.results.length+' source'+(data.results.length===1?'':'s')+' read'+(data.truncated?' · more results may exist':'')+(data.terms&&data.terms.length>1?' · Keyword variants: '+data.terms.slice(1).join(', '):'');const messages={search_unavailable:'Search unavailable. Results from this source are incomplete.',source_unavailable:'A matching source could not be read.',invalid_result_path:'A result had an invalid source path.',source_integrity_mismatch:'A source did not match its recorded revision and was excluded.',invalid_search_revision:'A search result had an invalid revision; freshness is unknown.',index_may_lag:'The Memory index may be delayed; no result does not prove absence.',mission_catalog_partial:'Mission search is limited to a selection of current Mission documents; history and attachments may be missing.',response_limit:'Source content exceeded the size limit; some results were not read.',time_limit:'Search time expired; results are incomplete. Try narrower keywords.'};const notices=[];for(const e of data.errors||[])notices.push(e.store+': '+(messages[e.reason]||'Source coverage is incomplete.')+(e.path?' ('+e.path+')':''));for(const n of data.warnings||[])notices.push(n.store+': '+(messages[n.reason]||'Source coverage may be incomplete.'));warnings.textContent=notices.join('\n');for(const row of data.results){const button=document.createElement('button');button.type='button';button.className='item';add(button,'span',row.store,'tag');add(button,'span',row.path,'path');const info=['As recorded: '+(row.classification||'unknown')];if(row.snapshot_status)info.push('snapshot: '+row.snapshot_status);if(row.recorded_at)info.push(row.recorded_at);if(row.review_overdue===true)info.push('review overdue');if(row.stale===true)info.push('marked stale');if(row.changed_since_search===true)info.push('changed since search');add(button,'span',info.join(' · '),'meta');button.addEventListener('click',()=>showSource(row,button));results.appendChild(button);}if(data.results.length===0)status.textContent=(data.errors.length?'No readable results. Some sources could not be searched. ':'No matching sources returned. Try shorter keywords. ')+status.textContent;}catch(_){status.textContent='Search failed or another search is running. Check the local SIOS connection and try again.';}finally{pending=false;form.querySelector('button').disabled=false;}});
</script>
</body>
</html>
